<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Suburb Opportunity Map — Sydney &amp; Brisbane</title>
  <meta name="description" content="Sydney and Brisbane suburbs mapped on price trend, rental yield and amenity access, built entirely from public property records." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231c5cab'/%3E%3Crect x='2.5' y='2.5' width='4' height='4' fill='%23cde2fb'/%3E%3Crect x='9.5' y='2.5' width='4' height='4' fill='%235598e7'/%3E%3Crect x='2.5' y='9.5' width='4' height='4' fill='%235598e7'/%3E%3Crect x='9.5' y='9.5' width='4' height='4' fill='%23b7dfb9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="9.5" height="9.5" rx="1" class="mk-1" />
        <rect x="13.5" y="1" width="9.5" height="9.5" rx="1" class="mk-2" />
        <rect x="1" y="13.5" width="9.5" height="9.5" rx="1" class="mk-3" />
        <rect x="13.5" y="13.5" width="9.5" height="9.5" rx="1" class="mk-4" />
      </svg>
      <span class="brand-text">
        <span class="brand-name">Suburb Opportunity Map</span>
        <span class="brand-sub" id="subtitle">Loading…</span>
      </span>
    </div>

    <div class="controls">
      <div class="ctl-group">
        <span class="ctl-label" aria-hidden="true">City</span>
        <div class="segmented" role="tablist" aria-label="City">
          <button id="city-sydney" class="seg-btn is-active" role="tab" aria-selected="true" type="button">Sydney</button>
          <button id="city-brisbane" class="seg-btn" role="tab" aria-selected="false" type="button">Brisbane</button>
        </div>
      </div>

      <div class="ctl-group">
        <span class="ctl-label" aria-hidden="true">Type</span>
        <div class="segmented" role="tablist" aria-label="Property type">
          <button id="class-houses" class="seg-btn is-active" role="tab" aria-selected="true" type="button">Houses</button>
          <button id="class-units" class="seg-btn" role="tab" aria-selected="false" type="button">Units</button>
        </div>
      </div>

      <div class="ctl-group">
        <span class="ctl-label" aria-hidden="true">View</span>
        <div class="segmented" role="tablist" aria-label="Map view">
          <button id="mode-trend" class="seg-btn is-active" role="tab" aria-selected="true" type="button">Trend</button>
          <button id="mode-yield" class="seg-btn" role="tab" aria-selected="false" type="button">Yield</button>
          <button id="mode-amenities" class="seg-btn" role="tab" aria-selected="false" type="button">Amenities</button>
          <button id="mode-combined" class="seg-btn" role="tab" aria-selected="false" type="button">Rating</button>
        </div>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="6.8" cy="6.8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input id="search" type="search" list="suburb-list" placeholder="Find a suburb" autocomplete="off" aria-label="Find a suburb" />
        <datalist id="suburb-list"></datalist>
      </div>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Colour theme: follow system">
        <span class="theme-dot" aria-hidden="true"></span>
        <span class="theme-text">Auto</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <div id="map" role="application" aria-label="Map of suburbs shaded by the selected measure"></div>
    <aside class="inspector" id="panel">
      <div id="panel-content">
        <p class="loading">Loading map data…</p>
      </div>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
