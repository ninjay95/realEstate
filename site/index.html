<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suburb Opportunity Map — Sydney &amp; Brisbane</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <h1>Suburb Opportunity Map</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>
    <div class="city-switch" role="tablist" aria-label="City">
      <button id="city-sydney" class="city-btn active" role="tab" aria-selected="true">Sydney</button>
      <button id="city-brisbane" class="city-btn" role="tab" aria-selected="false">Brisbane</button>
    </div>
    <div class="city-switch" role="tablist" aria-label="Map view">
      <button id="mode-trend" class="city-btn active" role="tab" aria-selected="true">Trend</button>
      <button id="mode-yield" class="city-btn" role="tab" aria-selected="false">Yield</button>
      <button id="mode-amenities" class="city-btn" role="tab" aria-selected="false">Amenities</button>
      <button id="mode-combined" class="city-btn" role="tab" aria-selected="false">Rating</button>
    </div>
    <div class="search-block">
      <input id="search" type="search" list="suburb-list" placeholder="Find a suburb…" autocomplete="off" />
      <datalist id="suburb-list"></datalist>
    </div>
  </header>

  <main class="layout">
    <div id="map" role="application" aria-label="Choropleth map of Sydney suburbs coloured by price trend"></div>

    <aside class="panel" id="panel">
      <div id="panel-content">
        <h2 class="panel-heading">Top opportunities</h2>
        <p class="panel-hint">Suburbs with the fastest-falling median values. Click one — or any suburb on the map — for detail.</p>
        <ol class="opportunity-list" id="opportunity-list"></ol>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
